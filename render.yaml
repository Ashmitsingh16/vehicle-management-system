# Free testing services only; see FREE-HOSTING.md for limits and setup order.
services:
  - type: web
    name: vehicle-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'false'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY_HOPS
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
  - type: web
    name: vehicle-web
    runtime: static
    buildCommand: node scripts/build-frontend.cjs
    staticPublishPath: ./dist
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: API_URL
        sync: false
